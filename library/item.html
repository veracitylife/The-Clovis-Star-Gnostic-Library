<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Item - Clovis Star</title>
  <meta name="description" content="Clovis Star library item detail page.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/thoth-live.css?v=20260913c">
</head>
<body>
  <header class="gt-header"><div class="gt-container gt-header__inner"><a href="/"><div class="gt-site-title">CLOVIS STAR</div><div class="gt-site-tagline">GNOSTIC LIBRARY</div></a><nav class="gt-header__nav"><ul class="gt-nav"><li><a href="/books/">Books</a></li><li><a href="/compare/">Compare</a></li><li><a href="/library/">Library</a></li><li><a href="/members/">Members</a></li></ul></nav></div></header>
  <main class="gt-container gt-container--wide">
    <article class="panel">
      <h1 class="section-title" id="title">Library Item</h1>
      <p id="meta" class="muted"></p>
      <div id="body"></div>
    </article>
  </main>
  <script type="module">
    import { loadBook, escapeHtml } from "/assets/js/app.js";
    const slug = location.pathname.split("/").filter(Boolean).pop();
    const title = document.getElementById("title");
    const meta = document.getElementById("meta");
    const body = document.getElementById("body");
    try {
      const book = await loadBook(slug);
      document.title = `${book.title} - Clovis Star`;
      title.textContent = book.title;
      meta.textContent = [book.collection, book.wordCount ? `${book.wordCount.toLocaleString()} words` : ""].filter(Boolean).join(" - ");
      body.innerHTML = `<p>${escapeHtml(book.excerpt || book.summary || "")}</p><p><a class="gt-btn gt-btn--primary" href="/books/?book=${encodeURIComponent(book.slug)}&collection=${encodeURIComponent(book.collection || "")}">Open Text</a></p>`;
    } catch {
      title.textContent = "Item not found";
      body.innerHTML = '<p>This library record is not currently public.</p>';
    }
  </script>
  <script src="/assets/js/thoth-live.js?v=20260914c" defer></script>
</body>
</html>
